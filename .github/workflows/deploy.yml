name: Build and publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: pip install openpyxl==3.1.5
      - name: Turn compendium.xlsx into the site's data (warnings show on the run's summary page)
        run: python scripts/export.py compendium.xlsx site/src/data/codex.json
      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Add the spreadsheet download
        run: cp compendium.xlsx "site/dist/787prada_Codex.xlsx"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
